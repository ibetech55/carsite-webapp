<div class="buy-car-card">
    <div class="buy-car-card__images">
        <img [src]="imageUrl" [alt]="imageUrl">
    </div>
    <div class="buy-car-card__info">
        <h2>{{price}}</h2>
        <h3>{{year}} {{makeName}} {{modelName}}</h3>
        <span>{{location}}</span>
        <span>{{mileage}}</span>
        <span>{{handleSeller()}}</span>
    </div>
</div>
