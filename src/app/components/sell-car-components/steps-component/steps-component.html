<div class="steps-component">
    <ul>
       <li *ngFor="let step of steps; let idx = index" (click)="handleStepIndexEmitter.emit(step)" [ngClass]="step.index === stepIndex.index ? 'active' : ''" >
            <span class="steps-component__label" [class.error]="checkErrors(step.label)">{{step.label}}</span>
            <span class="steps-component__desc"  [class.error]="checkErrors(step.label)">{{step.description}}</span>
       </li>
    </ul>
</div>
